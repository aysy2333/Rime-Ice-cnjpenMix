# Rime schema
# encoding: utf-8

schema:
  schema_id: japanese_pinyin
  name: 日文汉字拼音
  version: "1.0"
  description: |
    日文汉字拼音反查方案

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - erase/^xx$/
    - abbrev/^([a-z]).+$/$1/

translator:
  dictionary: japanese_pinyin
  spelling_hints: 0
